{% extends "base.html" %}

{% block title %}Add Sale | Sales Analytics{% endblock %}

{% block content %}
<section class="page-heading">
    <div><p class="eyebrow">NEW TRANSACTION</p><h1>Add a sale</h1><p class="muted">Enter the sale details below.</p></div>
</section>

<form class="form-panel sale-form" method="post" action="{{ url_for('add_sale') }}">
    <label class="field">Product
        <input type="text" name="product" value="{{ form.get('product', '') }}" required maxlength="100">
    </label>
    <label class="field">Category
        <input type="text" name="category" value="{{ form.get('category', '') }}" required maxlength="100">
    </label>
    <label class="field">Quantity
        <input type="number" name="quantity" value="{{ form.get('quantity', '') }}" min="1" step="1" required>
    </label>
    <label class="field">Price (₹ per item)
        <input type="number" name="price" value="{{ form.get('price', '') }}" min="0.01" step="0.01" required>
    </label>
    <label class="field">Customer name
        <input type="text" name="customer_name" value="{{ form.get('customer_name', '') }}" required maxlength="100">
    </label>
    <label class="field">Sale date
        <input type="date" name="sale_date" value="{{ form.get('sale_date', '') }}" required>
    </label>
    <div class="form-actions">
        <button class="button button-primary" type="submit">Save sale</button>
        <a class="button button-quiet" href="{{ url_for('sales') }}">Cancel</a>
    </div>
</form>
{% endblock %}
