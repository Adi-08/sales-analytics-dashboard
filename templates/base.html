<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sales Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('dashboard') }}">Sales <span>Analytics</span></a>
        <nav aria-label="Main navigation">
            <a class="{% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="{% if request.endpoint == 'sales' %}active{% endif %}" href="{{ url_for('sales') }}">Sales</a>
            <a class="{% if request.endpoint == 'add_sale' %}active{% endif %}" href="{{ url_for('add_sale') }}">Add Sale</a>
            <a class="{% if request.endpoint == 'upload' %}active{% endif %}" href="{{ url_for('upload') }}">Upload CSV</a>
        </nav>
    </header>

    <main class="page-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-list" aria-live="polite">
                    {% for category, message in messages %}
                        <p class="flash flash-{{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
